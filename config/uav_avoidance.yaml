# ============================================================================
# uav_avoidance_node 专属参数
# 多机机间避障决策 — 压航线 + 优先级判定
# ============================================================================
collision_threshold: 8.0   # 极近距离（m），需要立即让
proximity_threshold: 15.0 # 警告距离（m），需要减速
vertical_safe: 5.0         # 高度安全差（m），<此值需调高度
loop_freq: 20.0            # 控制循环频率（Hz）