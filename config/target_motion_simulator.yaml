# ============================================================================
# target_motion_simulator_node 专属参数
# 节点没有读取 common.yaml 里的共享参数，所以无需去重。
# 注意：以下默认值与代码 param() 调用中的默认值保持一致，
#       这样删掉 yaml 任何一行都不会让行为"突然变化"。
# ============================================================================
x_init: 60.0                # 初始 x 位置（米，NWU）
y_init: -100.0                # 初始 y 位置（米，NWU）
max_speed: 0.01            # 最大速度（m/s）
min_speed: 0.0             # 最小速度（m/s）
max_tangential_acc: 0.0    # 最大切向加速度（m/s²）
max_normal_acc: 0.0        # 最大法向加速度（m/s²）
sim_freq: 100.0            # 仿真频率（Hz）
trigger_freq: 0.1          # 触发频率（Hz）
marker_size: 1.0           # 目标标记大小
marker_frame: "map"        # 目标标记参考坐标系