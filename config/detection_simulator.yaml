# ============================================================================
# detection_simulator_node 专属参数
# 基于相机 FOV 几何投屏的"伪 YOLO 检测器"
# ============================================================================
image_width: 1920          # 图像宽度（像素）
image_height: 1080         # 图像高度（像素）
fov_h_deg: 60.0            # 水平 FOV（度）
fov_v_deg: 0.0             # 垂直 FOV（度，0=按比例算）
loop_freq: 20.0            # 控制循环频率（Hz）
target_topic: "/target_position"  # 目标真值 topic
label: "general_target"    # 检测标签