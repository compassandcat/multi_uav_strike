# ============================================================================
# waypoint_executor_node 参数
# ============================================================================
executor_rate: 50.0             # 执行循环频率（Hz）
uav_speed: 5.0                  # 航点飞行速度（m/s）
arrival_threshold: 2.0          # 到达阈值（米）
flight_mode_velocity: 0
flight_mode_position: 2
avoidance_safe_distance: 10.0
use_desired_yaw_from_wp: true
use_sim: false
ref_lat: 36.096
ref_lon: 114.392
ref_alt: 100.0
# 最后一个航点位置保持 P-controller 增益（1m 误差 → kp m/s，调小会更稳但恢复慢）
hold_kp: 0.8